name: Publish crates
on:
  workflow_dispatch:

env:
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      # Job logs cannot be read from outside this Forgejo, so the run keeps
      # its own output (outside the working tree: `cargo publish` refuses a
      # dirty checkout) and, on failure, files it as an issue (last step).
      - name: Test
        run: |
          set -o pipefail
          cargo test --all-features --locked 2>&1 | tee -a /tmp/publish.log
      - name: Publish
        run: |
          set -o pipefail
          cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }} 2>&1 | tee -a /tmp/publish.log
      - name: Report a failure as an issue
        if: failure()
        env:
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          {
            echo "The publish-crates run on \`${SHA:0:8}\` failed. Last 150 lines of its output:"
            echo
            echo "Working tree: $(git status --porcelain | wc -l) uncommitted path(s); rustc $(rustc --version)"
            echo
            echo '```'
            tail -150 /tmp/publish.log | sed 's/\x1b\[[0-9;]*m//g'
            echo '```'
          } > body.md
          python3 - <<'EOF'
          import json, os, urllib.request
          body = open('body.md').read()
          url = f"{os.environ['API']}/repos/{os.environ['REPO']}/issues"
          req = urllib.request.Request(url, data=json.dumps({"title": f"publish-crates failed on {os.environ['SHA'][:8]}", "body": body}).encode(), method="POST",
              headers={"Authorization": "token " + os.environ['TOKEN'], "Content-Type": "application/json"})
          with urllib.request.urlopen(req) as r:
              print("issue filed:", r.status)
          EOF
