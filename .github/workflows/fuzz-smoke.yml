name: Fuzz smoke

# Short, time-boxed fuzz runs on every push / PR — designed to
# catch regressions cheap, not to find new bugs. A longer
# scheduled hunt belongs in a separate job. Issue #20.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  FUZZ_TIME_PER_TARGET: 20  # seconds

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - arp
          - dns_udp
          - dns_tcp
          - http
          - icmp
          - tls
          - tls_handshake
          - layers
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Cache cargo registry + fuzz target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: |
            fuzz-${{ runner.os }}-
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || true
      - name: Smoke ${{ matrix.target }} (${{ env.FUZZ_TIME_PER_TARGET }}s)
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=${FUZZ_TIME_PER_TARGET} \
            -timeout=10 \
            -rss_limit_mb=2048
